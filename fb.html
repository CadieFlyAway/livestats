<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Stats</title>
<style>
  /* ====== COLORS: change these to your school's colors ====== */
  :root {
    --home: #2c58a7;        /* home team color */
    --visitor: #0b4d43;     /* visitor team color */
    --bg: #f3f4f6;
    --card: #ffffff;
    --ink: #111827;
    --muted: #6b7280;
    --line: #e5e7eb;
    --live: #dc2626;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); font-size: 15px; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 12px; }

  /* Scorebug */
  .bug { background: #0f172a; color: #fff; border-radius: 14px; padding: 16px 18px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; }
  .side { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .side.home { flex-direction: row-reverse; text-align: right; }
  .logo { width: 56px; height: 56px; border-radius: 50%; flex: none; display: grid; place-items: center; font-weight: 800; font-size: 17px; color: #fff; overflow: hidden; }
  .logo img { width: 100%; height: 100%; object-fit: contain; background: #fff; }
  .tname { font-weight: 700; font-size: 18px; line-height: 1.15; overflow: hidden; text-overflow: ellipsis; }
  .trec { color: #94a3b8; font-size: 13px; }
  .score { font-size: 46px; font-weight: 800; font-variant-numeric: tabular-nums; margin-left: auto; }
  .side.home .score { margin-left: 0; margin-right: auto; }
  .mid { text-align: center; min-width: 110px; }
  .period { font-weight: 700; font-size: 15px; letter-spacing: .04em; }
  .clock { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .badge { display: inline-block; margin-top: 4px; font-size: 11px; font-weight: 700; letter-spacing: .08em; padding: 2px 8px; border-radius: 99px; background: var(--live); }
  .badge.final { background: #475569; }
  .badge.pre { background: #0369a1; }
  .situ { margin-top: 6px; font-size: 13px; font-weight: 600; color: #fbbf24; white-space: nowrap; }
  .situ:empty { display: none; }
  .poss { display: inline-block; width: 14px; height: 9px; border-radius: 50%; background: #b45309; border: 1.5px solid #fbbf24; margin: 0 7px; vertical-align: 2px; }
  .dd { display: block; font-size: 12px; color: var(--muted); font-weight: 400; margin-top: 2px; }
  .sect { padding: 4px 0 6px; }
  .sect h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0; padding: 12px 14px 6px; }
  .drive { background: #f1f5f9; font-size: 12.5px; color: #475569; padding: 6px 14px !important; display: block !important; }

  .meta { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px; color: var(--muted); font-size: 12.5px; margin: 8px 4px 12px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #16a34a; margin-right: 5px; vertical-align: 1px; }
  .dot.stale { background: #f59e0b; }
  .dot.err { background: var(--live); }

  .card { background: var(--card); border-radius: 12px; border: 1px solid var(--line); margin-bottom: 12px; overflow: hidden; }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0; padding: 12px 14px 8px; }

  .tabs { display: flex; gap: 4px; padding: 4px; background: #e5e7eb; border-radius: 10px; margin-bottom: 12px; }
  .tabs button { flex: 1; border: 0; background: transparent; padding: 9px 6px; border-radius: 7px; font: inherit; font-weight: 600; color: #374151; cursor: pointer; }
  .tabs button.on { background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.12); color: var(--ink); }
  .subtabs { display: flex; gap: 6px; padding: 10px 14px 0; flex-wrap: wrap; }
  .subtabs button { border: 1px solid var(--line); background: #fff; border-radius: 99px; padding: 6px 14px; font: inherit; font-size: 14px; cursor: pointer; }
  .subtabs button.on { color: #fff; border-color: transparent; }

  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { padding: 7px 8px; text-align: center; white-space: nowrap; border-bottom: 1px solid var(--line); }
  th { font-size: 12px; color: var(--muted); font-weight: 600; background: #f9fafb; }
  td.l, th.l { text-align: left; }
  td.name { text-align: left; font-weight: 600; position: sticky; left: 0; background: var(--card); }
  th.name { position: sticky; left: 0; }
  tr.tot td { font-weight: 700; background: #f9fafb; }
  tr.tot td.name { background: #f9fafb; }
  .on-court { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #16a34a; margin-left: 5px; vertical-align: 2px; }
  .num { color: var(--muted); font-weight: 500; margin-right: 4px; }

  /* Linescore */
  .ls td.t { text-align: left; font-weight: 700; }
  .ls td.f { font-weight: 800; }
  .chip { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }

  /* Team stat comparison */
  .cmp { padding: 6px 14px 14px; }
  .cmp-row { display: grid; grid-template-columns: 60px 1fr 60px; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); }
  .cmp-row:last-child { border-bottom: 0; }
  .cmp-row .v { font-weight: 700; font-variant-numeric: tabular-nums; }
  .cmp-row .v.r { text-align: right; }
  .cmp-label { text-align: center; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .bar { display: flex; height: 7px; border-radius: 99px; overflow: hidden; background: var(--line); gap: 2px; }

  /* Play-by-play */
  .pbp-tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px 14px 4px; }
  .pbp-tools select, .pbp-tools label { font: inherit; font-size: 14px; }
  .pbp-tools select { padding: 5px 8px; border-radius: 7px; border: 1px solid var(--line); }
  .plays { list-style: none; margin: 0; padding: 0; }
  .plays li { display: grid; grid-template-columns: 52px 6px 1fr auto; gap: 10px; align-items: center; padding: 9px 14px; border-bottom: 1px solid var(--line); }
  .plays li.scoring { background: #fefce8; }
  .plays li.scoring .txt { font-weight: 600; }
  .plays .tm { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; }
  .plays .stripe { width: 6px; height: 100%; min-height: 22px; border-radius: 3px; }
  .plays .sc { font-weight: 700; font-variant-numeric: tabular-nums; font-size: 13px; color: var(--muted); }
  .plays li.scoring .sc { color: var(--ink); }
  .prd-head { background: #f9fafb; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 6px 14px !important; display: block !important; }
  .empty { padding: 24px; text-align: center; color: var(--muted); }

  .drv-sum { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 4px 14px 14px; }
  .drv-team { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .drv-team b { display: block; margin-bottom: 6px; }
  .drv-team dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 0; font-size: 13.5px; }
  .drv-team dt { color: var(--muted); } .drv-team dd { margin: 0; text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
  table.drv td { font-size: 13.5px; }
  table.drv tr.score td { background: #fefce8; font-weight: 600; }
  table.drv tr.score td.name { background: #fefce8; }
  .res-live { display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: .06em; color: #fff; background: var(--live); border-radius: 99px; padding: 1px 6px; }
  .field { position: relative; width: 120px; height: 12px; background: #dcfce7; border-radius: 3px; overflow: hidden; }
  .field::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; border-left: 1px dashed #86efac; }
  .field span { position: absolute; top: 2px; bottom: 2px; border-radius: 2px; min-width: 3px; }
  @media (max-width: 640px) { .drv-sum { grid-template-columns: 1fr; } }
  .hidden { display: none !important; }
  .abbr { display: none; }
  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 10px 0 24px; }

  @media (max-width: 640px) {
    .bug { padding: 12px; gap: 8px; }
    .logo { width: 38px; height: 38px; font-size: 13px; }
    .tname { font-size: 14px; }
    .trec { display: none; }
    .score { font-size: 32px; }
    .clock { font-size: 20px; }
    .mid { min-width: 70px; }
    .side { flex-direction: column; gap: 4px; text-align: center; }
    .side.home { flex-direction: column; text-align: center; }
    .score, .side.home .score { margin: 0; }
    th, td { padding: 6px 6px; font-size: 13.5px; }
    .tabs button { font-size: 13px; padding: 9px 2px; }
    .full { display: none; }
    .abbr { display: inline; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="bug" id="bug">
    <div class="side visitor">
      <div class="logo" id="vLogo" style="background:var(--visitor)">V</div>
      <div style="min-width:0"><div class="tname"><span id="vName">Visitor</span><span class="poss hidden" id="vPoss" title="Possession"></span></div><div class="trec" id="vRec"></div></div>
      <div class="score" id="vScore">–</div>
    </div>
    <div class="mid">
      <div class="period" id="period">Loading…</div>
      <div class="clock" id="clock"></div>
      <div class="badge pre" id="badge">PREGAME</div>
      <div class="situ" id="situ"></div>
    </div>
    <div class="side home">
      <div class="logo" id="hLogo" style="background:var(--home)">H</div>
      <div style="min-width:0"><div class="tname"><span class="poss hidden" id="hPoss" title="Possession"></span><span id="hName">Home</span></div><div class="trec" id="hRec"></div></div>
      <div class="score" id="hScore">–</div>
    </div>
  </div>

  <div class="meta">
    <span id="venue"></span>
    <span id="conn"><span class="dot" id="connDot"></span><span id="connText">Connecting…</span></span>
  </div>

  <div class="card"><div class="scroll"><table class="ls" id="linescore"></table></div></div>

  <div class="tabs" role="tablist">
    <button class="on" data-tab="box">Box Score</button>
    <button data-tab="team">Team Stats</button>
    <button data-tab="pbp">Play-by-Play</button>
    <button data-tab="drives" id="drivesTab" class="hidden">Drives</button>
  </div>

  <section id="tab-box">
    <div class="card">
      <div class="subtabs" id="boxTeams"></div>
      <div id="boxBody"></div>
    </div>
  </section>

  <section id="tab-team" class="hidden">
    <div class="card"><h2>Team comparison</h2><div class="cmp" id="cmp"></div></div>
  </section>

  <section id="tab-pbp" class="hidden">
    <div class="card">
      <div class="pbp-tools">
        <select id="pbpPeriod"><option value="all">All periods</option></select>
        <label><input type="checkbox" id="pbpScoring"> Scoring plays only</label>
      </div>
      <ul class="plays" id="plays"></ul>
    </div>
  </section>

  <section id="tab-drives" class="hidden">
    <div class="card"><h2>Drive summary</h2><div class="drv-sum" id="drvSum"></div></div>
    <div class="card"><h2>Drive chart</h2><div class="scroll"><table class="drv" id="drives"></table></div></div>
  </section>

  <footer>Updates automatically every few seconds — no need to refresh.</footer>
</div>

<script>
/* =====================================================================
   SETTINGS — the only part you normally need to edit
   ===================================================================== */
const CONFIG = {
  // Where the live XML lives. Can be overridden with ?feed=URL in the address bar.
  DATA_URL: "https://pub-46cba8c9ab194768b021576a7f12badd.r2.dev/fbgame.xml",
  // How often to check for updates (seconds).
  POLL_SECONDS: 10,
  // Optional logo images, keyed by the team id in the XML (e.g. "RAV").
  // Leave empty to show a colored circle with the team abbreviation.
  LOGOS: {
    "URS": "logos/ursuline.png",
    "NDC": "logos/ndcl.png",
  },
  // Page title prefix
  TITLE: "Live Stats",
  // Optional: show these instead of the date / start time in the XML (leave "" to use the XML)
  GAME_DATE: "11/20/2026",
  GAME_TIME: "7:30 PM",
};
/* ===================================================================== */

const params = new URLSearchParams(location.search);
const FEED = params.get("feed") || CONFIG.DATA_URL;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const A = (el, name, def = "") => (el && el.getAttribute(name) != null ? el.getAttribute(name) : def);
const N = (el, name) => { const v = parseFloat(A(el, name, "0")); return isNaN(v) ? 0 : v; };

let lastText = null, lastOK = 0, model = null;
let ui = { tab: "box", boxTeam: "V" };

/* ---------------- Parsing ---------------- */
function prettyName(check) {
  if (!check) return "";
  if (check.toUpperCase() === "TEAM") return "Team";
  const [last, first] = check.split(",").map(s => s.trim());
  const cap = s => s.toLowerCase().replace(/(^|[\s\-'])([a-z])/g, (m, a, b) => a + b.toUpperCase());
  return first ? `${cap(first)} ${cap(last)}` : cap(last);
}
function formalName(name) { // "Last, First" -> "First Last"
  if (!name) return "";
  const p = name.split(",").map(s => s.trim());
  return p.length > 1 ? `${p[1]} ${p[0]}` : name;
}

function parse(text) {
  const doc = new DOMParser().parseFromString(text, "application/xml");
  if (doc.querySelector("parsererror")) throw new Error("XML not complete yet");
  const root = doc.documentElement;
  const sport = root.nodeName.toLowerCase();       // bbgame, fbgame, sogame, vbgame, bsgame...
  const venue = root.querySelector("venue");
  const rules = root.querySelector("venue rules, rules");
  const status = root.querySelector("status");

  const teams = [...root.querySelectorAll(":scope > team")].map(t => {
    const ls = t.querySelector("linescore");
    return {
      el: t,
      vh: A(t, "vh"),
      id: A(t, "id") || A(t, "abb"),
      abb: A(t, "abb"),
      name: A(t, "name"),
      record: A(t, "record"),
      score: ls ? A(ls, "score", "0") : "0",
      lines: ls ? [...ls.querySelectorAll("lineprd")].map(p => ({ prd: A(p, "prd"), score: A(p, "score") })) : [],
      totals: t.querySelector(":scope > totals"),
      players: [...t.querySelectorAll(":scope > player")].filter(p => A(p, "uni") !== "TM" && A(p, "name").toUpperCase() !== "TEAM"),
    };
  });

  const plays = [];
  const playsRoot = root.querySelector(":scope > plays");
  if (playsRoot) {
    playsRoot.querySelectorAll("play, drivestart").forEach(p => {
      const parent = p.closest("period, qtr, quarter, half, inning, set") || p.parentElement;
      plays.push({ el: p, kind: p.nodeName, period: A(parent, "number", A(p, "prd", A(p, "period", ""))) });
    });
  }
  // Football: current down & distance / possession (IAU writes this at the end of <plays>)
  const dtg = playsRoot ? playsRoot.querySelector(":scope > downtogo") : null;
  const drives = [...root.querySelectorAll(":scope > drives > drive")];
  return { sport, venue, rules, status, teams, plays, dtg, drives };
}

/* ---------------- Labels ---------------- */
const ORD = ["", "1st", "2nd", "3rd", "4th"];
function numPeriods(m) { return parseInt(A(m.rules, "prds", A(m.rules, "qtrs", m.sport === "bbgame" ? "2" : "4")), 10) || 4; }
function periodLabel(m, n) {
  n = parseInt(n, 10);
  if (!n) return "";
  const prds = parseInt(A(m.rules, "prds", A(m.rules, "qtrs", m.sport === "bbgame" ? "2" : "4")), 10) || 4;
  const qh = A(m.rules, "qh", prds === 2 ? "H" : "Q");
  if (n > prds) return (n - prds > 1 ? (n - prds) : "") + "OT";
  const ord = ["", "1st", "2nd", "3rd", "4th", "5th", "6th", "7th", "8th", "9th"][n] || n + "th";
  if (m.sport === "bsgame" || m.sport === "sbgame") return ord + " Inn";
  if (m.sport === "vbgame") return "Set " + n;
  return qh === "H" ? ord + " Half" : ord + " Qtr";
}
function shortPeriod(m, n) {
  const l = periodLabel(m, n);
  return l.replace(" Half", "").replace(" Qtr", "").replace(" Inn", "").replace("Set ", "");
}

/* ---------------- Render: header ---------------- */
function team(m, vh) { return m.teams.find(t => t.vh === vh) || m.teams[vh === "V" ? 0 : 1] || { name: "", lines: [], players: [] }; }

function logoHTML(t) {
  const src = CONFIG.LOGOS[t.id];
  if (src) return `<img src="${esc(src)}" alt="">`;
  return esc((t.id || t.name || "?").slice(0, 4));
}

function renderHeader(m) {
  const v = team(m, "V"), h = team(m, "H");
  $("vName").textContent = v.name; $("hName").textContent = h.name;
  $("vRec").textContent = v.record ? `(${v.record})` : ""; $("hRec").textContent = h.record ? `(${h.record})` : "";
  $("vScore").textContent = v.score; $("hScore").textContent = h.score;
  $("vLogo").innerHTML = logoHTML(v); $("hLogo").innerHTML = logoHTML(h);

  const s = m.status, d = m.dtg;
  const lastPlay = m.plays.length ? m.plays[m.plays.length - 1] : null;
  const complete = A(s, "complete") === "Y" || (m.sport === "fbgame" && A(m.venue, "end") !== "");
  const prd = A(s, "period", A(s, "qtr", A(d, "qtr", lastPlay ? lastPlay.period : "")));
  const clock = A(s, "clock", A(d, "clock", ""));
  const badge = $("badge");
  const started = m.plays.length > 0 || Number(v.score) + Number(h.score) > 0;
  let situ = "";
  $("vPoss").classList.add("hidden"); $("hPoss").classList.add("hidden");
  if (complete) { $("period").textContent = "FINAL" + (parseInt(prd) > numPeriods(m) ? "/" + shortPeriod(m, prd) : ""); $("clock").textContent = ""; badge.textContent = "FINAL"; badge.className = "badge final"; }
  else if (!started) { $("period").textContent = CONFIG.GAME_TIME || A(m.venue, "time", A(m.venue, "start", "")); $("clock").textContent = ""; badge.textContent = "PREGAME"; badge.className = "badge pre"; }
  else {
    $("period").textContent = periodLabel(m, prd);
    $("clock").textContent = clock === "00:00" ? "End" : clock.replace(/^0(\d)/, "$1");
    badge.textContent = "LIVE"; badge.className = "badge";
    if (d) {   // football down & distance + possession
      const poss = A(d, "hasball") === "H" || A(d, "id") === h.id ? "H" : "V";
      $(poss.toLowerCase() + "Poss").classList.remove("hidden");
      const down = parseInt(A(d, "down"), 10);
      if (down >= 1 && down <= 4) situ = `${ORD[down]} & ${A(d, "togo")} at ${A(d, "spot")}`;
    }
  }
  $("situ").textContent = situ;
  document.title = `${v.id || v.name} ${v.score}, ${h.id || h.name} ${h.score} | ${CONFIG.TITLE}`;

  const ven = m.venue;
  $("venue").textContent = [CONFIG.GAME_DATE || A(ven, "date"), A(ven, "stadium") || A(ven, "location"), A(ven, "stadium") ? A(ven, "location") : "", parseInt(A(ven, "attend")) ? "Att: " + A(ven, "attend") : ""].filter(Boolean).join(" · ");
}

function renderLinescore(m) {
  const v = team(m, "V"), h = team(m, "H");
  const n = Math.max(v.lines.length, h.lines.length, numPeriods(m));
  let head = `<tr><th class="l"></th>`;
  for (let i = 1; i <= n; i++) head += `<th>${esc(shortPeriod(m, i))}</th>`;
  head += `<th>T</th></tr>`;
  const row = (t, color) => {
    let r = `<tr><td class="t"><span class="chip" style="background:${color}"></span><span class="full">${esc(t.name)}</span><span class="abbr">${esc(t.abb || t.id || t.name)}</span></td>`;
    for (let i = 0; i < n; i++) r += `<td>${esc(t.lines[i] ? t.lines[i].score : "")}</td>`;
    return r + `<td class="f">${esc(t.score)}</td></tr>`;
  };
  $("linescore").innerHTML = head + row(v, "var(--visitor)") + row(h, "var(--home)");
}

/* ---------------- Render: box score ---------------- */
const BB_COLS = [
  ["MIN", s => A(s, "min", "")],
  ["FG", s => `${N(s, "fgm")}-${N(s, "fga")}`],
  ["3PT", s => `${N(s, "fgm3")}-${N(s, "fga3")}`],
  ["FT", s => `${N(s, "ftm")}-${N(s, "fta")}`],
  ["OREB", s => N(s, "oreb")],
  ["DREB", s => N(s, "dreb")],
  ["REB", s => N(s, "treb")],
  ["AST", s => N(s, "ast")],
  ["STL", s => N(s, "stl")],
  ["BLK", s => N(s, "blk")],
  ["TO", s => N(s, "to")],
  ["PF", s => N(s, "pf")],
  ["PTS", s => N(s, "tp")],
];

function renderBoxTeams(m) {
  const v = team(m, "V"), h = team(m, "H");
  $("boxTeams").innerHTML = [["V", v, "var(--visitor)"], ["H", h, "var(--home)"]].map(([vh, t, c]) =>
    `<button data-vh="${vh}" class="${ui.boxTeam === vh ? "on" : ""}" style="${ui.boxTeam === vh ? "background:" + c : ""}"><span class="full">${esc(t.name)}</span><span class="abbr">${esc(t.abb || t.id || t.name)}</span></button>`).join("");
  $("boxTeams").querySelectorAll("button").forEach(b => b.onclick = () => { ui.boxTeam = b.dataset.vh; renderBox(model); });
}

function renderBox(m) {
  renderBoxTeams(m);
  const t = team(m, ui.boxTeam);
  if (m.sport === "bbgame") return renderBasketballBox(t);
  if (m.sport === "fbgame") return renderFootballBox(t);
  renderGenericBox(t);
}

/* ---------------- Football box score (SIDEARM-style sections) ---------------- */
const avg = (a, b) => (b ? (a / b).toFixed(1) : "0.0");
const FB_SECTIONS = [
  ["Passing", "pass", [["C-A-I", s => `${N(s, "comp")}-${N(s, "att")}-${N(s, "int")}`], ["YDS", s => N(s, "yds")], ["TD", s => N(s, "td")], ["LONG", s => N(s, "long")], ["SACK", s => N(s, "sacks")]], "yds"],
  ["Rushing", "rush", [["ATT", s => N(s, "att")], ["GAIN", s => N(s, "gain")], ["LOSS", s => N(s, "loss")], ["NET", s => N(s, "yds")], ["AVG", s => avg(N(s, "yds"), N(s, "att"))], ["TD", s => N(s, "td")], ["LONG", s => N(s, "long")]], "yds"],
  ["Receiving", "rcv", [["REC", s => N(s, "no")], ["YDS", s => N(s, "yds")], ["AVG", s => avg(N(s, "yds"), N(s, "no"))], ["TD", s => N(s, "td")], ["LONG", s => N(s, "long")]], "yds"],
  ["Defense", "defense", [["SOLO", s => N(s, "tackua")], ["AST", s => N(s, "tacka")], ["TOT", s => N(s, "tot_tack") || N(s, "tackua") + N(s, "tacka")], ["TFL", s => N(s, "tflua") + N(s, "tfla") / 2], ["SACKS", s => N(s, "sacks") || N(s, "sackua") + N(s, "sacka") / 2], ["INT", s => N(s, "int")], ["PBU", s => N(s, "brup")], ["QBH", s => N(s, "qbh")], ["FF", s => N(s, "ff")], ["FR", s => N(s, "fr")]], "tot_tack"],
  ["Field goals", "fg", [["FG", s => `${N(s, "made")}-${N(s, "att")}`], ["LONG", s => N(s, "long")], ["BLKD", s => N(s, "blkd")]], "att"],
  ["PATs", "pat", [["KICK", s => `${N(s, "kickmade")}-${N(s, "kickatt")}`]], "kickatt"],
  ["Punting", "punt", [["NO", s => N(s, "no")], ["YDS", s => N(s, "yds")], ["AVG", s => avg(N(s, "yds"), N(s, "no"))], ["LONG", s => N(s, "long")], ["IN20", s => N(s, "inside20")], ["TB", s => N(s, "tb")], ["50+", s => N(s, "plus50")]], "no"],
  ["Kickoffs", "ko", [["NO", s => N(s, "no")], ["YDS", s => N(s, "yds")], ["AVG", s => avg(N(s, "yds"), N(s, "no"))], ["TB", s => N(s, "tb")], ["OB", s => N(s, "ob")]], "no"],
  ["Kick returns", "kr", [["NO", s => N(s, "no")], ["YDS", s => N(s, "yds")], ["AVG", s => avg(N(s, "yds"), N(s, "no"))], ["TD", s => N(s, "td")], ["LONG", s => N(s, "long")]], "no"],
  ["Punt returns", "pr", [["NO", s => N(s, "no")], ["YDS", s => N(s, "yds")], ["AVG", s => avg(N(s, "yds"), N(s, "no"))], ["TD", s => N(s, "td")], ["LONG", s => N(s, "long")]], "no"],
  ["Interception returns", "ir", [["NO", s => N(s, "no")], ["YDS", s => N(s, "yds")], ["TD", s => N(s, "td")], ["LONG", s => N(s, "long")]], "no"],
];

function renderFootballBox(t) {
  let html = "";
  for (const [title, tag, cols, sortKey] of FB_SECTIONS) {
    const rows = t.players.map(p => ({ p, s: p.querySelector(":scope > " + tag) })).filter(r => r.s);
    if (!rows.length) continue;
    rows.sort((a, b) => N(b.s, sortKey) - N(a.s, sortKey));
    html += `<div class="sect"><h3>${esc(title)}</h3><div class="scroll"><table><tr><th class="name l">Player</th>${cols.map(c => `<th>${c[0]}</th>`).join("")}</tr>`;
    rows.forEach(({ p, s }) => {
      html += `<tr><td class="name"><span class="num">${esc(A(p, "uni"))}</span>${esc(formalName(A(p, "name")))}</td>${cols.map(c => `<td>${esc(c[1](s))}</td>`).join("")}</tr>`;
    });
    const ts = t.totals && t.totals.querySelector(":scope > " + tag);
    if (ts && rows.length > 1) html += `<tr class="tot"><td class="name">Team</td>${cols.map(c => `<td>${esc(c[1](ts))}</td>`).join("")}</tr>`;
    html += `</table></div></div>`;
  }
  $("boxBody").innerHTML = html || `<div class="empty">No player stats yet.</div>`;
}

function renderBasketballBox(t) {
  const starters = t.players.filter(p => A(p, "gs") === "1");
  const bench = t.players.filter(p => A(p, "gs") !== "1" && A(p, "gp", "1") !== "0");
  const head = `<tr><th class="name l">Player</th>${BB_COLS.map(c => `<th>${c[0]}</th>`).join("")}</tr>`;
  const row = p => {
    const s = p.querySelector("stats");
    return `<tr><td class="name"><span class="num">${esc(A(p, "uni"))}</span>${esc(formalName(A(p, "name")))}${A(p, "oncourt") === "Y" ? '<span class="on-court" title="On the floor"></span>' : ""}</td>${BB_COLS.map(c => `<td>${esc(c[1](s))}</td>`).join("")}</tr>`;
  };
  const sub = label => `<tr><td class="name l" style="color:var(--muted);font-size:12px;font-weight:700">${label}</td>${BB_COLS.map(() => "<td></td>").join("")}</tr>`;
  const ts = t.totals && t.totals.querySelector("stats");
  const tot = ts ? `<tr class="tot"><td class="name">Totals</td>${BB_COLS.map(c => `<td>${esc(c[0] === "MIN" ? "" : c[1](ts))}</td>`).join("")}</tr>` : "";
  const pct = ts ? `<tr><td class="name" style="color:var(--muted)">FG% / 3P% / FT%</td><td colspan="${BB_COLS.length}" class="l" style="color:var(--muted)">${pctStr(ts, "fgm", "fga")} · ${pctStr(ts, "fgm3", "fga3")} · ${pctStr(ts, "ftm", "fta")}</td></tr>` : "";
  $("boxBody").innerHTML = `<div class="scroll"><table>${head}${starters.length ? sub("STARTERS") + starters.map(row).join("") : ""}${bench.length ? sub("BENCH") + bench.map(row).join("") : ""}${(!starters.length && !bench.length) ? t.players.map(row).join("") : ""}${tot}${pct}</table></div>`;
}
function pctStr(s, m, a) { const x = N(s, a); return x ? (100 * N(s, m) / x).toFixed(1) + "%" : "–"; }

// Any other sport: build one table per stat category found under <player> (e.g. rush, pass, rcv, def, shots, attack…)
function renderGenericBox(t) {
  const cats = new Map();
  t.players.forEach(p => [...p.children].forEach(c => {
    if (!cats.has(c.nodeName)) cats.set(c.nodeName, new Set());
    [...c.attributes].forEach(a => cats.get(c.nodeName).add(a.name));
  }));
  if (!cats.size) { $("boxBody").innerHTML = `<div class="empty">No player stats yet.</div>`; return; }
  let html = "";
  for (const [cat, attrSet] of cats) {
    const cols = [...attrSet];
    const rows = t.players.filter(p => p.querySelector(":scope > " + cat));
    html += `<h2>${esc(cat)}</h2><div class="scroll"><table><tr><th class="name l">Player</th>${cols.map(c => `<th>${esc(c.toUpperCase())}</th>`).join("")}</tr>`;
    rows.forEach(p => {
      const s = p.querySelector(":scope > " + cat);
      html += `<tr><td class="name"><span class="num">${esc(A(p, "uni"))}</span>${esc(formalName(A(p, "name")))}</td>${cols.map(c => `<td>${esc(A(s, c))}</td>`).join("")}</tr>`;
    });
    const ts = t.totals && t.totals.querySelector(":scope > " + cat);
    if (ts) html += `<tr class="tot"><td class="name">Totals</td>${cols.map(c => `<td>${esc(A(ts, c))}</td>`).join("")}</tr>`;
    html += `</table></div>`;
  }
  $("boxBody").innerHTML = html;
}

/* ---------------- Render: team comparison ---------------- */
function renderTeamStats(m) {
  const v = team(m, "V"), h = team(m, "H");
  let vs = v.totals && (v.totals.querySelector("stats") || v.totals.firstElementChild);
  let hs = h.totals && (h.totals.querySelector("stats") || h.totals.firstElementChild);
  if (!vs || !hs) { $("cmp").innerHTML = `<div class="empty">No team totals yet.</div>`; return; }
  let rows;
  if (m.sport === "fbgame") {
    vs = v.totals; hs = h.totals;   // football totals are split into child elements
    const q = (s, tag, a) => N(s.querySelector(":scope > " + tag), a);
    const top = s => { const [mm, ss] = A(s.querySelector(":scope > misc"), "top", "0:0").split(":").map(Number); return (mm || 0) * 60 + (ss || 0); };
    rows = [
      ["First downs", s => q(s, "firstdowns", "no"), s => q(s, "firstdowns", "no")],

      ["Plays – avg", s => `${N(s, "totoff_plays")} – ${N(s, "totoff_avg")}`, s => N(s, "totoff_plays")],
      ["Rushing (att–yds)", s => `${q(s, "rush", "att")}–${q(s, "rush", "yds")}`, s => q(s, "rush", "yds")],
      ["Passing yards", s => q(s, "pass", "yds"), s => q(s, "pass", "yds")],
      ["Comp–Att–Int", s => `${q(s, "pass", "comp")}–${q(s, "pass", "att")}–${q(s, "pass", "int")}`, s => q(s, "pass", "comp")],
      ["3rd down conv.", s => `${q(s, "conversions", "thirdconv")}-${q(s, "conversions", "thirdatt")}`, s => q(s, "conversions", "thirdconv")],
      ["4th down conv.", s => `${q(s, "conversions", "fourthconv")}-${q(s, "conversions", "fourthatt")}`, s => q(s, "conversions", "fourthconv")],
      ["Red zone (scores–att)", s => `${q(s, "redzone", "scores")}-${q(s, "redzone", "att")}`, s => q(s, "redzone", "scores")],
      ["Penalties–yards", s => `${q(s, "penalties", "no")}–${q(s, "penalties", "yds")}`, s => q(s, "penalties", "yds")],
      ["Fumbles–lost", s => `${q(s, "fumbles", "no")}–${q(s, "fumbles", "lost")}`, s => q(s, "fumbles", "lost")],
      ["Sacks by", s => q(s, "defense", "sacks"), s => q(s, "defense", "sacks")],
      ["Punts–avg", s => `${q(s, "punt", "no")}–${avg(q(s, "punt", "yds"), q(s, "punt", "no"))}`, s => q(s, "punt", "no")],
      ["Possession", s => A(s.querySelector(":scope > misc"), "top", "0:00"), top],
    ];
  } else if (m.sport === "bbgame") {
    const pct = (s, a, b) => N(s, b) ? +(100 * N(s, a) / N(s, b)).toFixed(1) : 0;
    rows = [
      ["Field goals", s => `${N(s, "fgm")}-${N(s, "fga")}`, s => N(s, "fgm")],
      ["FG %", s => pct(s, "fgm", "fga") + "%", s => pct(s, "fgm", "fga")],
      ["3-pointers", s => `${N(s, "fgm3")}-${N(s, "fga3")}`, s => N(s, "fgm3")],
      ["Free throws", s => `${N(s, "ftm")}-${N(s, "fta")}`, s => N(s, "ftm")],
      ["Rebounds", s => N(s, "treb"), s => N(s, "treb")],
      ["Offensive reb.", s => N(s, "oreb"), s => N(s, "oreb")],
      ["Assists", s => N(s, "ast"), s => N(s, "ast")],
      ["Steals", s => N(s, "stl"), s => N(s, "stl")],
      ["Blocks", s => N(s, "blk"), s => N(s, "blk")],
      ["Turnovers", s => N(s, "to"), s => N(s, "to")],
      ["Fouls", s => N(s, "pf"), s => N(s, "pf")],
    ];
  } else {
    rows = [...vs.attributes].map(a => [a.name.toUpperCase(), s => A(s, a.name), s => N(s, a.name)]);
  }
  $("cmp").innerHTML = rows.map(([label, fmt, val]) => {
    const a = val(vs), b = val(hs), total = a + b || 1;
    return `<div class="cmp-row"><div class="v">${esc(fmt(vs))}</div><div><div class="cmp-label">${esc(label)}</div><div class="bar"><div style="width:${100 * a / total}%;background:var(--visitor)"></div><div style="width:${100 * b / total}%;background:var(--home)"></div></div></div><div class="v r">${esc(fmt(hs))}</div></div>`;
  }).join("");
}

/* ---------------- Render: play-by-play ---------------- */
const SHOT = { "3PTR": "3-pt jumper", JUMPER: "jumper", LAYUP: "layup", DUNK: "dunk", TIPIN: "tip-in", HOOK: "hook shot", FT: "free throw" };
function playText(m, p) {
  const el = p.el;
  if (A(el, "text")) {                                     // football, soccer, etc. include narrative text
    // "Reardon,Patrick" -> "Patrick Reardon" (names have no space after the comma; sentence commas do)
    return A(el, "text").replace(/\b([A-Z][A-Za-z'\-]+),([A-Z][A-Za-z'\-.]+)\b/g, "$2 $1");
  }
  const who = prettyName(A(el, "checkname"));
  const teamName = (team(m, A(el, "vh")).name) || A(el, "team");
  const act = A(el, "action").toUpperCase(), type = A(el, "type").toUpperCase();
  const by = who && who !== "Team" ? who : teamName;
  switch (act) {
    case "GOOD": return `${by} made ${SHOT[type] || type.toLowerCase()}`;
    case "MISS": return `${by} missed ${SHOT[type] || type.toLowerCase()}`;
    case "REBOUND": return `${by} ${type === "OFF" ? "offensive" : type === "DEF" ? "defensive" : ""} rebound`.replace("  ", " ");
    case "ASSIST": return `Assist by ${by}`;
    case "STEAL": return `Steal by ${by}`;
    case "BLOCK": return `Block by ${by}`;
    case "TURNOVER": return `Turnover by ${by}${type ? " (" + type.toLowerCase() + ")" : ""}`;
    case "FOUL": return `Foul on ${by}${type && type !== "PERS" ? " (" + type.toLowerCase() + ")" : ""}`;
    case "TIMEOUT": return `Timeout ${teamName}${type ? " (" + type.toLowerCase() + ")" : ""}`;
    case "SUB": return `${by} ${type === "IN" ? "subs in" : "subs out"}`;
    default: return [by, act.toLowerCase(), type.toLowerCase()].filter(Boolean).join(" ");
  }
}

function renderPlays(m) {
  // period picker
  const periods = [...new Set(m.plays.map(p => p.period))];
  const sel = $("pbpPeriod"), cur = sel.value;
  sel.innerHTML = `<option value="all">All periods</option>` + periods.map(p => `<option value="${esc(p)}">${esc(periodLabel(m, p) || "Period " + p)}</option>`).join("");
  sel.value = periods.includes(cur) || cur === "all" ? cur : "all";

  const scoringOnly = $("pbpScoring").checked;
  const fb = m.sport === "fbgame";
  const v = team(m, "V"), h = team(m, "H");
  const sideOf = el => { const vh = A(el, "vh"); if (vh) return vh; const hb = A(el, "hasball"); return hb === h.id || hb === h.abb ? "H" : hb === v.id ? "V" : ""; };
  const FB_SCORE = /touchdown|field goal.*\bgood\b|\bsafety\b|kick attempt.*\bgood\b|(rush|pass) attempt.*\bgood\b/i;

  let list = m.plays.filter(p => sel.value === "all" || p.period === sel.value)
    .filter(p => !(fb && A(p.el, "tokens").startsWith("{DRIVE}")));   // IAU repeats drive starts as a play; we show <drivestart> instead
  list = list.map(p => ({ p, scoring: p.kind === "play" && (fb ? FB_SCORE.test(A(p.el, "text")) : (A(p.el, "action") === "GOOD" || A(p.el, "score") === "Y" || (A(p.el, "vscore") !== "" && A(p.el, "hscore") !== ""))) }));
  if (scoringOnly) list = list.filter(x => x.scoring);
  list.reverse();   // newest first

  if (!list.length) { $("plays").innerHTML = `<li class="empty" style="display:block">No plays yet.</li>`; return; }
  let html = "", lastPrd = null;
  for (const { p, scoring } of list) {
    if (p.period !== lastPrd) { html += `<li class="prd-head">${esc(periodLabel(m, p.period) || "Period " + p.period)}</li>`; lastPrd = p.period; }
    const side = fb && A(p.el, "type") === "#" && p.kind === "play" ? "" : sideOf(p.el);   // no team color on toss / quarter-start notes
    if (p.kind === "drivestart") {
      const tm = team(m, side);
      html += `<li class="drive">▲ ${esc(tm.name)} drive begins${A(p.el, "spot") ? " at " + esc(spotText(m, A(p.el, "spot"))) : ""}${A(p.el, "clock") ? " (" + esc(A(p.el, "clock")) + ")" : ""}</li>`;
      continue;
    }
    const sc = A(p.el, "vscore") !== "" ? `${A(p.el, "vscore")}-${A(p.el, "hscore")}` : "";
    let dd = "";
    if (fb && A(p.el, "type") !== "#") {
      const down = parseInt(A(p.el, "down"), 10);
      if (down >= 1 && down <= 4) dd = `${ORD[down]} & ${A(p.el, "togo")} at ${A(p.el, "spot")}`;
    }
    html += `<li class="${scoring ? "scoring" : ""}"><span class="tm">${esc(A(p.el, "time", A(p.el, "clock")))}</span><span class="stripe" style="background:${side === "H" ? "var(--home)" : side === "V" ? "var(--visitor)" : "transparent"}"></span><span class="txt">${esc(playText(m, p))}${dd ? `<span class="dd">${esc(dd)}</span>` : ""}</span><span class="sc">${esc(sc)}</span></li>`;
  }
  $("plays").innerHTML = html;
}
// "V20" -> "URS20", "H35" -> "NDC35"
function spotText(m, s) {
  const mm = /^([VH])(\d+)$/.exec(s);
  return mm ? (team(m, mm[1]).id || mm[1]) + mm[2] : s;
}

/* ---------------- Render: football drives ---------------- */
const DRIVE_START = { KO: "Kickoff", ONSIDE: "Onside kick", PUNT: "Punt", INT: "Interception", FUMB: "Fumble", DOWNS: "Downs", MFG: "Missed FG", FGA: "Missed FG", BLKP: "Blocked punt", BLKFG: "Blocked FG", SAF: "Safety kick" };
const DRIVE_END = { TD: "Touchdown", FG: "Field goal", MFG: "Missed FG", FGA: "Missed FG", PUNT: "Punt", DOWNS: "Downs", INT: "Interception", FUMB: "Fumble", HALF: "End of half", GAME: "End of game", SAF: "Safety", BLKP: "Blocked punt", BLKFG: "Blocked FG" };

// Yard line measured from the offense's own goal line (0-100). Accepts "URS20", "V20", "H35" or "20".
function yardFromOwn(m, spot, side) {
  const mm = /^([A-Za-z]*)(\d+)$/.exec(String(spot || "").trim());
  if (!mm) return null;
  const n = parseInt(mm[2], 10), pre = mm[1].toUpperCase();
  if (!pre) return n;
  const own = team(m, side);
  const ownCodes = [side, own.id, own.abb].filter(Boolean).map(x => x.toUpperCase());
  return ownCodes.includes(pre) ? n : 100 - n;
}
function yardText(y) { if (y == null) return ""; if (y >= 100) return "End zone"; return y === 50 ? "50" : y < 50 ? `Own ${y}` : `Opp ${100 - y}`; }

function driveInfo(m, d, isLast) {
  const sp = A(d, "start").split(","), ep = A(d, "end").split(",");
  const side = A(d, "vh") || (A(d, "team") === team(m, "H").id ? "H" : "V");
  const st = { how: A(d, "start_how", sp[0] || ""), qtr: A(d, "start_qtr", sp[1] || ""), time: A(d, "start_time", sp[2] || ""), spot: A(d, "start_spot", sp[3] || "") };
  const en = { how: A(d, "end_how", ep[0] || ""), qtr: A(d, "end_qtr", ep[1] || ""), time: A(d, "end_time", ep[2] || ""), spot: A(d, "end_spot", ep[3] || "") };
  const live = !en.how && (!en.qtr || en.qtr === "0");
  const sy = yardFromOwn(m, st.spot, side);
  let ey = yardFromOwn(m, en.spot, side);
  if (live && isLast && m.dtg) ey = yardFromOwn(m, A(m.dtg, "spot"), side);   // drive in progress: use current ball spot
  const endHow = en.how.toUpperCase();
  if (endHow === "TD") ey = 100;
  return { side, st, en, live, sy, ey, endHow, plays: N(d, "plays"), yards: N(d, "yards"), top: A(d, "top"), scoring: endHow === "TD" || endHow === "FG" };
}
const secs = t => { const [a, b] = String(t || "0:0").split(":").map(Number); return (a || 0) * 60 + (b || 0); };
const mmss = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;

function renderDrives(m) {
  const isFb = m.sport === "fbgame";
  $("drivesTab").classList.toggle("hidden", !isFb);
  if (!isFb) return;
  const list = m.drives.map((d, i) => driveInfo(m, d, i === m.drives.length - 1));

  // Per-team summary
  $("drvSum").innerHTML = ["V", "H"].map(vh => {
    const t = team(m, vh), ds = list.filter(x => x.side === vh);
    const starts = ds.map(x => x.sy).filter(y => y != null);
    const avgStart = starts.length ? Math.round(starts.reduce((a, b) => a + b, 0) / starts.length) : null;
    const td = ds.filter(x => x.endHow === "TD").length, fg = ds.filter(x => x.endHow === "FG").length;
    const color = vh === "H" ? "var(--home)" : "var(--visitor)";
    return `<div class="drv-team" style="border-top:4px solid ${color}"><b>${esc(t.name)}</b><dl>
      <dt>Drives</dt><dd>${ds.length}</dd>
      <dt>Touchdowns / FGs</dt><dd>${td} / ${fg}</dd>
      <dt>Avg. start</dt><dd>${esc(yardText(avgStart) || "–")}</dd>
      <dt>Plays / yards</dt><dd>${ds.reduce((a, x) => a + x.plays, 0)} / ${ds.reduce((a, x) => a + x.yards, 0)}</dd>
      <dt>Time on drives</dt><dd>${mmss(ds.reduce((a, x) => a + secs(x.top), 0))}</dd></dl></div>`;
  }).join("");

  if (!list.length) { $("drives").innerHTML = `<tr><td class="empty">No drives yet.</td></tr>`; return; }
  let html = `<tr><th class="name l">Team</th><th>Qtr</th><th class="l">How started</th><th>Start</th><th>Plays</th><th>Yds</th><th>TOP</th><th class="l">Result</th><th>End</th><th class="l">Field</th></tr>`;
  for (const x of list.slice().reverse()) {   // newest first
    const t = team(m, x.side), color = x.side === "H" ? "var(--home)" : "var(--visitor)";
    const lo = Math.min(x.sy ?? 0, x.ey ?? x.sy ?? 0), hi = Math.max(x.sy ?? 0, x.ey ?? x.sy ?? 0);
    const bar = x.sy == null ? "" : `<div class="field"><span style="left:${lo}%;width:${Math.max(hi - lo, 1)}%;background:${color}"></span></div>`;
    const result = x.live ? `<span class="res-live">IN PROGRESS</span>` : esc(DRIVE_END[x.endHow] || x.en.how || "–");
    html += `<tr class="${x.scoring ? "score" : ""}">
      <td class="name"><span class="chip" style="background:${color}"></span>${esc(t.abb || t.id)}</td>
      <td>${esc(shortPeriod(m, x.st.qtr))}</td>
      <td class="l">${esc(DRIVE_START[x.st.how.toUpperCase()] || x.st.how)}${x.st.time ? ` <span style="color:var(--muted)">${esc(x.st.time)}</span>` : ""}</td>
      <td>${esc(yardText(x.sy))}</td>
      <td>${x.plays}</td><td>${x.yards}</td><td>${esc(x.top)}</td>
      <td class="l">${result}${!x.live && x.en.time ? ` <span style="color:var(--muted)">${esc(x.en.time)}</span>` : ""}</td>
      <td>${x.live ? "" : esc(yardText(x.ey))}</td>
      <td class="l">${bar}</td></tr>`;
  }
  $("drives").innerHTML = html;
}

/* ---------------- Main loop ---------------- */
function renderAll() {
  if (!model) return;
  renderHeader(model); renderLinescore(model); renderBox(model); renderTeamStats(model); renderPlays(model); renderDrives(model);
}

function setConn(state, text) {
  $("connDot").className = "dot " + state;
  $("connText").textContent = text;
}

async function poll() {
  try {
    const sep = FEED.includes("?") ? "&" : "?";
    const res = await fetch(FEED + sep + "t=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const text = await res.text();
    if (text !== lastText) {
      model = parse(text);   // throws if the file was caught mid-write; we keep the last good copy
      lastText = text;
      renderAll();
    }
    lastOK = Date.now();
    setConn("", "Updated " + new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit", second: "2-digit" }));
  } catch (e) {
    const age = lastOK ? Math.round((Date.now() - lastOK) / 1000) : null;
    setConn(model ? "stale" : "err", model ? `Reconnecting… (last update ${age}s ago)` : "Waiting for stats feed…");
    console.warn("Live stats fetch failed:", e.message);
  }
}

// Tabs
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
  ui.tab = b.dataset.tab;
  document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("on", x === b));
  ["box", "team", "pbp", "drives"].forEach(t => $("tab-" + t).classList.toggle("hidden", t !== ui.tab));
});
$("pbpPeriod").onchange = () => model && renderPlays(model);
$("pbpScoring").onchange = () => model && renderPlays(model);

// Poll only while the page is visible (saves requests when fans switch tabs), and refresh right away when they come back.
document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });
// Check often only while the game is live: once a minute before kickoff, every 5 minutes after the final.
function nextDelay() {
  const b = $("badge").textContent;
  if (model && b === "PREGAME") return 60 * 1000;
  if (model && b === "FINAL") return 5 * 60 * 1000;
  return CONFIG.POLL_SECONDS * 1000;
}
async function loop() { if (!document.hidden) await poll(); setTimeout(loop, nextDelay()); }
loop();
</script>
